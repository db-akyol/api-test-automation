name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Every day at 06:00 UTC, to catch changes in the public API
    - cron: '0 6 * * *'

jobs:
  playwright:
    name: Playwright API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  postman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run collection
        run: npm run test:postman -- --reporters cli,junit --reporter-junit-export newman/results.xml
      - name: Upload Newman results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: newman-results
          path: newman/
